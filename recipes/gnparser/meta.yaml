{% set version = "1.15.1" %}
{% set sha256 = "6ae6223ec17e58aa8a62fd1cca03c511514081f690ebf773f1fd00a3c174f123" %}

package:
  name: "gnparser"
  version: {{ version }}

source:
  url: https://github.com/gnames/gnparser/archive/refs/tags/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('gnparser', max_pin="x") }}

requirements:
  build:
    - {{ compiler('go') }}

test:
  commands:
    - gnparser -V
    - gnparser "Homo sapiens Linnaeus 1758"

about:
  home: "https://parser.globalnames.org"
  dev_url: "https://github.com/gnames/gnparser"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "GNparser normalises scientific names and extracts their semantic elements."

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  identifiers:
    - doi:10.5281/zenodo.5111569
  skip-lints:
    - compiler_needs_stdlib_c
