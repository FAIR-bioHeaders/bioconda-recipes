{% set name = "fhr" %}
{% set version = "0.3.3" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d97df7fe13261a9e7238b540c6fbd790deae858347910da43faded80f810e6aa

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --no-cache-dir -vvv
  entry_points:
    - fhr-convert = fhr.cli:convert_main
    - fhr-validate = fhr.cli:validate_main
    - fhr-fasta-strip = fhr.cli:fasta_strip_main
    - fhr-fasta-combine = fhr.cli:fasta_combine_main
    - fhr-fasta-validate = fhr.cli:fasta_validate_main
    - fhr-gfa-strip = fhr.cli:gfa_strip_main
    - fhr-gfa-combine = fhr.cli:gfa_combine_main
    - fhr-gfa-validate = fhr.cli:gfa_validate_main
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  host:
    - python >=3.9
    - pip
    - poetry-core >=1.0.0
  run:
    - python >=3.9
    - jsonschema-with-format >=4.21.1,<5
    - pyyaml >=6.0.1,<7

test:
  imports:
    - fhr
    - fhr.cli
  commands:
    - fhr-convert --version
    - fhr-validate --help
    - fhr-fasta-combine --help
    - fhr-fasta-strip --help
    - fhr-fasta-validate --help
    - fhr-gfa-combine --help
    - fhr-gfa-strip --help
    - fhr-gfa-validate --help

about:
  home: https://github.com/FAIR-bioHeaders/FHR-File-Converter
  summary: Validate and convert FAIR Header Reference genome (FHR) metadata in JSON, YAML, HTML microdata, FASTA and GFA.
  description: |
    FHR embeds provenance metadata in reference genome FASTA and GFA files.
    These tools convert between JSON, YAML, HTML microdata and embedded
    FASTA/GFA headers, validate metadata against the FHR schema, attach and
    strip headers, and verify the SHA-512/256 file checksum. Plain and
    gzip/bgzip-compressed files are streamed with bounded memory.
  license: Public-Domain
  license_family: PUBLIC-DOMAIN
  license_file: LICENSE
  doc_url: https://github.com/FAIR-bioHeaders/FHR-Specification
  dev_url: https://github.com/FAIR-bioHeaders/FHR-File-Converter

extra:
  recipe-maintainers:
    - adamjohnwright
  identifiers:
    - doi:10.1093/bib/bbae122
    - doi:10.5281/zenodo.6762547
